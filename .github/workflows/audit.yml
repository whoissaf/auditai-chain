name: Smart Contract Audit Pipeline

on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: 'Audit ID'
        required: true
      contract_name:
        description: 'Contract Name'
        required: true
      tier:
        description: 'User Tier'
        required: true
      backend_webhook_url:
        description: 'Backend Webhook URL'
        required: true
      webhook_secret:
        description: 'Webhook Secret'
        required: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Security Tools
      run: |
        echo "🔧 Upgrading pip and installing Slither..."
        python3 -m pip install --upgrade pip
        pip3 install slither-analyzer solc-select
        
        echo " Setting up Solidity compiler..."
        solc-select install 0.8.19
        solc-select use 0.8.19
        
        echo "🔧 Installing Mythril..."
        pip3 install mythril
        
        echo "🔧 Installing Echidna (if Pro/Enterprise)..."
        if [ "${{ github.event.inputs.tier }}" = "pro" ] || [ "${{ github.event.inputs.tier }}" = "enterprise" ]; then
          # PERBAIKAN: Coba multiple URLs dengan error handling
          ECHIDNA_INSTALLED=false
          
          # Coba URL 1: Rilis terbaru v2.2.3
          echo "📥 Trying Echidna v2.2.3..."
          if curl -sL -o echidna.tar.gz "https://github.com/crytic/echidna/releases/download/v2.2.3/echidna-test-v2.2.3-x86_64-unknown-linux-gnu.tar.gz" && file echidna.tar.gz | grep -q "gzip"; then
            tar xzf echidna.tar.gz
            sudo mv echidna-test /usr/local/bin/ 2>/dev/null || true
            ECHIDNA_INSTALLED=true
            echo "✅ Echidna v2.2.3 installed"
          fi
          
          # Coba URL 2: Rilis v2.2.2 (fallback)
          if [ "$ECHIDNA_INSTALLED" = "false" ]; then
            echo "📥 Trying Echidna v2.2.2..."
            if curl -sL -o echidna.tar.gz "https://github.com/crytic/echidna/releases/download/v2.2.2/echidna-test-v2.2.2-x86_64-unknown-linux-gnu.tar.gz" && file echidna.tar.gz | grep -q "gzip"; then
              tar xzf echidna.tar.gz
              sudo mv echidna-test /usr/local/bin/ 2>/dev/null || true
              ECHIDNA_INSTALLED=true
              echo "✅ Echidna v2.2.2 installed"
            fi
          fi
          
          # Coba URL 3: Rilis v2.2.1 (fallback terakhir)
          if [ "$ECHIDNA_INSTALLED" = "false" ]; then
            echo "📥 Trying Echidna v2.2.1..."
            if curl -sL -o echidna.tar.gz "https://github.com/crytic/echidna/releases/download/v2.2.1/echidna-test-v2.2.1-x86_64-unknown-linux-gnu.tar.gz" && file echidna.tar.gz | grep -q "gzip"; then
              tar xzf echidna.tar.gz
              sudo mv echidna-test /usr/local/bin/ 2>/dev/null || true
              ECHIDNA_INSTALLED=true
              echo "✅ Echidna v2.2.1 installed"
            fi
          fi
          
          # Cleanup
          rm -f echidna.tar.gz
          
          # Jika semua gagal, lanjutkan tanpa Echidna (sesuai PRD fallback)
          if [ "$ECHIDNA_INSTALLED" = "false" ]; then
            echo "⚠️ Echidna installation failed. Continuing without fuzzing."
            echo "⚠️ This is acceptable per PRD v2.0 fallback strategy."
          fi
        else
          echo "⏭️ Echidna skipped (not Pro/Enterprise tier)"
        fi

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
    
    - name: Install Node Dependencies
      run: npm ci || npm install
    
    - name: Run Full Audit Pipeline
      env:
        AUDIT_ID: ${{ github.event.inputs.audit_id }}
        CONTRACT_NAME: ${{ github.event.inputs.contract_name }}
        TIER: ${{ github.event.inputs.tier }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BACKEND_WEBHOOK_URL: ${{ github.event.inputs.backend_webhook_url }}
        WEBHOOK_SECRET: ${{ github.event.inputs.webhook_secret }}
      run: node scripts/run-audit.js
    
    - name: Upload Results as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audit-results-${{ github.event.inputs.audit_id }}
        path: audits/${{ github.event.inputs.audit_id }}/
