name: Smart Contract Audit Pipeline

on:
  workflow_dispatch:
    inputs:
      audit_id:
        description: 'Audit ID'
        required: true
      contract_name:
        description: 'Contract Name'
        required: true
      tier:
        description: 'User Tier'
        required: true
      backend_webhook_url:
        description: 'Backend Webhook URL'
        required: true
      webhook_secret:
        description: 'Webhook Secret'
        required: true

jobs:
  audit:
    runs-on: ubuntu-latest # Menggunakan Ubuntu 24.04
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Security Tools
      run: |
        echo "🔧 Upgrading pip and installing Slither..."
        python3 -m pip install --upgrade pip
        pip3 install slither-analyzer solc-select
        
        echo " Setting up Solidity compiler..."
        solc-select install 0.8.19
        solc-select use 0.8.19
        
        echo "🔧 Installing Mythril..."
        pip3 install mythril
        
        echo "🔧 Installing Echidna (if Pro/Enterprise)..."
        if [ "${{ github.event.inputs.tier }}" = "pro" ] || [ "${{ github.event.inputs.tier }}" = "enterprise" ]; then
          ECHIDNA_VERSION="v2.2.3"
          INSTALLED=false
          
          # Coba 1: Ubuntu 24.04 (karena ubuntu-latest sekarang 24.04)
          echo "📥 Trying Echidna for Ubuntu 24.04..."
          if curl -sL -f -o echidna.tar.gz "https://github.com/crytic/echidna/releases/download/${ECHIDNA_VERSION}/echidna-test-${ECHIDNA_VERSION}-Ubuntu-24.04.tar.gz"; then
            tar -xzf echidna.tar.gz
            # Nama binary bisa 'echidna' atau 'echidna-test'
            sudo mv echidna-test /usr/local/bin/ 2>/dev/null || sudo mv echidna /usr/local/bin/ 2>/dev/null || true
            INSTALLED=true
            echo "✅ Echidna installed from Ubuntu-24.04 binary"
          fi
          
          # Coba 2: Fallback ke Ubuntu 22.04
          if [ "$INSTALLED" = "false" ]; then
            echo "📥 Trying Echidna for Ubuntu 22.04..."
            if curl -sL -f -o echidna.tar.gz "https://github.com/crytic/echidna/releases/download/${ECHIDNA_VERSION}/echidna-test-${ECHIDNA_VERSION}-Ubuntu-22.04.tar.gz"; then
              tar -xzf echidna.tar.gz
              sudo mv echidna-test /usr/local/bin/ 2>/dev/null || sudo mv echidna /usr/local/bin/ 2>/dev/null || true
              INSTALLED=true
              echo "✅ Echidna installed from Ubuntu-22.04 binary"
            fi
          fi
          
          rm -f echidna.tar.gz
          
          # Graceful Fallback (Sesuai PRD v2.0 Section 6.3)
          if [ "$INSTALLED" = "false" ]; then
            echo "⚠️ Echidna installation failed. Continuing without fuzzing."
            echo "⚠️ This is acceptable per PRD v2.0 fallback strategy."
          fi
        else
          echo "️ Echidna skipped (not Pro/Enterprise tier)"
        fi

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
    
    - name: Install Node Dependencies
      run: npm ci || npm install
    
    - name: Run Full Audit Pipeline
      env:
        AUDIT_ID: ${{ github.event.inputs.audit_id }}
        CONTRACT_NAME: ${{ github.event.inputs.contract_name }}
        TIER: ${{ github.event.inputs.tier }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BACKEND_WEBHOOK_URL: ${{ github.event.inputs.backend_webhook_url }}
        WEBHOOK_SECRET: ${{ github.event.inputs.webhook_secret }}
      run: node scripts/run-audit.js
    
    - name: Upload Results as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: audit-results-${{ github.event.inputs.audit_id }}
        path: audits/${{ github.event.inputs.audit_id }}/
